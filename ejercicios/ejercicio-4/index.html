Crear un contador numérico que se pueda incrementar y decrementar con botones.
    ● HTML: Mostrar un número inicial, y dos botones (+ y -).

    ● JS: Al presionar +, aumentar el número; al presionar -, disminuirlo, actualizando el valor mostrado.
-->

<body>
    <h1 id="numero"></h1>
    <button id="btnIncrementar"> + </button>
    <button id="btnDisminuir"> - </button>
    <script src="script.js"></script>
</body>
</html>
