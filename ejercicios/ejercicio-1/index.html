Crear una página HTML con un botón que cambie el color de fondo usando JavaScript.
    ● HTML: Un título <h1>, un párrafo y un botón.

    ● JS: Al hacer clic en el botón, cambia el color de fondo de la página a un color aleatorio. 
-->

<html lang="en">
<head>

    <title>ejercicio 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Ejercicio 1</h1>
    <p>Al presionar el boton, cambia el color del fondo a uno random</p>
    <button id="btnColor">Presiona el boton</button>
    <script src="script.js"></script>
</body>
</html>
