<!-- 
Crear una lista de tareas donde el usuario pueda agregar y eliminar elementos.
    ● HTML: Un campo de texto, un botón para agregar, y una lista (<ul>).
    ● CSS: Estilos para la lista y los botones.
    ● JS: Cuando el usuario escribe una tarea y presiona agregar, la tarea aparece en la lista; 
        al hacer clic en cada tarea, esta se elimina. 
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejercicio 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <p>Tarea: <input type="text" name="" id="inputTarea" placeholder="ingrese una tarea"></p>
    <button id="btnTarea">Agregar</button>
    <ul id="listaTareas"></ul>
    <script src="script.js"></script>
</body>
</html>
